name: Site Audit
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: List files
        run: |
          for d in _pages _talks _teaching _portfolio _posts _drafts _publications files images talkmap markdown_generator scripts; do
            if [ -e "$d" ]; then find "$d" -maxdepth 3 -type f -printf '%p\t%s bytes\n' | sort; fi
          done
          for f in talkmap.ipynb talkmap.py talkmap_out.ipynb; do [ -f "$f" ] && stat -c '%n\t%s bytes' "$f"; done
      - name: Print key files
        run: |
          echo '###ABOUT'; cat _pages/about.md
          echo '###PUBS'; cat _pages/publications.html
          echo '###NAV'; cat _data/navigation.yml
