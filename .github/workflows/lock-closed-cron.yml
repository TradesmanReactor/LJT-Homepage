name: Pages diagnostics

on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and initialize Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          echo "GET before creation"
          curl -sS -i \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages" | sed -n '1,30p'
          echo "POST creation"
          curl -sS -i -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}' | sed -n '1,40p'
          echo "GET after creation"
          curl -sS -i \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages" | sed -n '1,40p'
